<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投資者性格探索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+TC:wght@400;700&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#F8F6FC;font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}
  #root{min-height:100vh;}
  button{font-family:inherit;}
  a{color:inherit;}
  @keyframes pop{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes slide{from{left:50%}}
  @keyframes ring{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .bar-dot{animation:slide .9s cubic-bezier(.2,.8,.2,1) both}
  .type-badge{animation:ring .5s ease-out both}
  .type-card{transition:transform .15s, box-shadow .15s}
  .type-card:hover,.type-card:focus-visible{transform:translateY(-2px);box-shadow:0 6px 18px rgba(30,30,46,.10)}
  @keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
  @keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .slide-in-right{animation:inR .38s cubic-bezier(.2,.8,.2,1) both}
  .slide-in-left{animation:inL .38s cubic-bezier(.2,.8,.2,1) both}
  .fade-in{animation:fade .3s ease both}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  p,h1,h2{text-wrap:pretty}
  #next-tab{transition:transform .15s, box-shadow .15s}
  #next-tab:hover{transform:translateY(-2px)}
  button:focus-visible,a:focus-visible{outline:3px solid #C4B5FD;outline-offset:2px}
  @media (prefers-reduced-motion: reduce){.bar-dot,.type-badge,.slide-in-right,.slide-in-left,.fade-in{animation:none}.type-card,#next-tab{transition:none}}
  @keyframes spinslow{to{transform:rotate(360deg)}}
  .sigil-spin{animation:spinslow 24s linear infinite}
  @media (prefers-reduced-motion: reduce){.sigil-spin{animation:none}}
  /* ── 教練的信：牛皮紙＋燒開動畫 ── */
  @property --burn { syntax:'<percentage>'; inherits:false; initial-value:0%; }
  .parchment{position:relative;overflow:hidden;border-radius:4px;padding:30px 24px 26px;color:#3E2A14;
    font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
    background:
      radial-gradient(ellipse 60% 40% at 18% 22%, rgba(150,95,40,.18), transparent 70%),
      radial-gradient(ellipse 45% 35% at 82% 78%, rgba(130,80,30,.16), transparent 70%),
      radial-gradient(ellipse at 50% 45%, #F4E4C4 0%, #EAD3A4 52%, #D6B47A 82%, #A9773F 100%);
    box-shadow:0 14px 34px rgba(60,35,10,.35), inset 0 0 46px rgba(110,62,22,.55), inset 0 0 8px rgba(60,30,10,.85);}
  .parchment::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.42;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 0.36 0 0 0 0 0.22 0 0 0 0 0.08 0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  .parchment::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, transparent 62%, rgba(70,35,10,.28) 88%, rgba(40,18,5,.55) 100%);}
  .parchment > .pc-body{position:relative;z-index:1}
  .pc-title{font-family:"Cinzel","Noto Serif TC",serif;letter-spacing:3px}
  .pc-card{background:rgba(255,246,222,.42);border:1px solid rgba(122,74,30,.28);border-radius:6px}
  .pc-link{background:none;border:none;padding:0;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;color:#7A3E12;text-decoration:underline;text-underline-offset:3px}
  .wax{position:relative;width:74px;height:74px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%, #C8382F 0%, #9B1C1C 55%, #6E0F0F 100%);
    box-shadow:0 3px 8px rgba(60,10,5,.45), inset 0 -3px 6px rgba(0,0,0,.35), inset 0 3px 5px rgba(255,160,140,.35);}
  .wax::before{content:"";position:absolute;inset:7px;border-radius:50%;border:2px dashed rgba(255,215,190,.45)}
  /* 燒開：焦黑層從中央往外退，邊緣是不規則的火線 */
  .burn-char,.burn-ember{position:absolute;inset:-60px;z-index:3;pointer-events:none;animation:burn 2.8s cubic-bezier(.45,.05,.25,1) forwards}
  .burn-char{filter:url(#burnEdge);
    background:radial-gradient(circle at 50% 38%, transparent var(--burn), #2A1709 calc(var(--burn) + 2%), #120904 calc(var(--burn) + 10%))}
  .burn-ember{filter:url(#burnEdge) blur(0.6px);mix-blend-mode:screen;
    background:radial-gradient(circle at 50% 38%, transparent calc(var(--burn) - 2.5%), rgba(255,214,120,.95) calc(var(--burn) - 0.8%), rgba(255,110,20,.9) calc(var(--burn) + 0.8%), rgba(150,30,0,.55) calc(var(--burn) + 2.6%), transparent calc(var(--burn) + 4.5%))}
  @keyframes burn{0%{--burn:0%;opacity:1}82%{opacity:1}100%{--burn:150%;opacity:0}}
  .embers{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
  .ember{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;opacity:0;
    background:radial-gradient(circle, #FFE39A 0%, #FF8A1F 55%, rgba(255,70,0,0) 100%);
    box-shadow:0 0 8px 2px rgba(255,120,30,.75);animation:rise 2.6s ease-out forwards}
  @keyframes rise{0%{opacity:0;transform:translate(0,0) scale(1)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-340px) scale(.3)}}
  .pc-reveal{animation:reveal 2.8s ease both}
  @keyframes reveal{0%,30%{opacity:.0}60%{opacity:1}100%{opacity:1}}
  @media (prefers-reduced-motion: reduce){.burn-char,.burn-ember,.embers{display:none}.pc-reveal{animation:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes drift{0%,100%{left:var(--from)}50%{left:var(--to)}}
  .cover-dot{animation:drift 4.5s ease-in-out infinite}
  #start-quiz:focus-visible,.type-card:focus-visible{outline:3px solid #C4B5FD;outline-offset:2px}
  @keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .trend-line{stroke-dasharray:900;animation:draw 2.4s ease-out both}
  .trend-area{animation:fadein 1.2s ease-out .9s both}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .type-card:hover .type-icon{animation:bob .6s ease-in-out}
  @media (prefers-reduced-motion: reduce){.cover-dot,.trend-line,.trend-area,.type-card:hover .type-icon{animation:none}.type-card{transition:none}}
  /* 揭曉：三條光譜依序落點 → 你最接近 → 符文由暗轉亮 → 類型名 */
  @keyframes rvIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes rvDot{from{left:50%;transform:translateX(-50%) scale(.6)}to{transform:translateX(-50%) scale(1)}}
  @keyframes rvSigil{0%{opacity:0;transform:scale(.55) rotate(-25deg);filter:grayscale(1) blur(4px)}55%{opacity:1;filter:grayscale(.4) blur(0)}100%{opacity:1;transform:scale(1) rotate(0);filter:none}}
  @keyframes rvGlow{0%{opacity:0;transform:scale(.4)}40%{opacity:.9}100%{opacity:0;transform:scale(1.9)}}
  @keyframes rvName{0%{opacity:0;letter-spacing:14px;filter:blur(6px)}100%{opacity:1;letter-spacing:4px;filter:none}}
  .rv{animation:rvIn .5s ease both}
  .rv-dot{animation:rvDot .75s cubic-bezier(.2,.8,.2,1) both}
  .rv-sigil{animation:rvSigil 1s cubic-bezier(.2,.8,.2,1) both}
  .rv-glow{animation:rvGlow 1.2s ease-out both}
  .rv-name{animation:rvName .8s cubic-bezier(.2,.8,.2,1) both}
  @media (prefers-reduced-motion: reduce){.rv,.rv-dot,.rv-sigil,.rv-name{animation:none}.rv-glow{display:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.9/babel.min.js"></script>
<script src="quiz-core.js?v=8.3"></script>
<script src="shared.js?v=8.3"></script>
<script src="icons.js?v=8.3"></script>
<script src="config.js?v=8.3"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// 測驗與結果合在同一個檔案：網址 # 後面沒有作答代碼時顯示測驗，有代碼（或 #types）時顯示結果。
// 按鈕只改 # 標記、不寫檔名，所以檔案怎麼改名、放哪裡都連得回來。
const { viewOf } = window.QUIZ_SHARED;

// ── 測驗畫面 ──
const QuizApp = (() => {
const { useState, useEffect, useRef } = React;
const Q = window.QUIZ;
const { FONT, CLR, TYPE_CLR, encode, isSkipped, toggleMulti, validMulti, sampleAnswers, LINK } = window.QUIZ_SHARED;

// 簡版流程（v8）：封面只有開始鈕；作答中途存在本機，重新整理或離開後可以接著做；題目、計分與完整版相同，只是文字精簡
const NOW_TOTAL = Q.SAFE_QS.length + Q.POS_QS.length + Q.BEHAV_QS.length;
const SECTIONS = [
  { key:"scale", name:"性格探索", count:`${Q.SCALE_QS.length} 題` },
  { key:"know",  name:"金融小挑戰", count:`${Q.KNOW_QS.length} 題`,
    title:"第 2 關：金融小挑戰", desc:"有標準答案，不確定就選「不知道」。" },
  { key:"now",   name:"你的現況", count:`${NOW_TOTAL - 2}～${NOW_TOTAL} 題`,
    title:"第 3 關：你的現況", desc:"前面問的是「你會怎麼想」，這一關問的是「你實際做過什麼」。兩者不一樣很正常，結果會以你做過的事為準，照實回答就好。" },
];
const STEPS = [
  ...Q.SCALE_QS.map((_, i) => ({ k:"scale", i })),
  { k:"chapter", c:1 }, ...Q.KNOW_QS.map((_, i) => ({ k:"know", i })),
  { k:"chapter", c:2 }, ...Q.SAFE_QS.map((_, i) => ({ k:"safe", i })), ...Q.POS_QS.map((_, i) => ({ k:"pos", i })), ...Q.BEHAV_QS.map((_, i) => ({ k:"behav", i })),
];
const TOTAL_Q = STEPS.filter(s => s.k !== "chapter").length;
const skipStep = (step, answers) => (step.k === "pos" && isSkipped(Q.POS_QS[step.i], answers.pos)) || (step.k === "behav" && isSkipped(Q.BEHAV_QS[step.i], answers.pos));

const PROGRESS_KEY = "investor-quiz-progress-v8";
function readProgress() {
  try {
    const p = JSON.parse(localStorage.getItem(PROGRESS_KEY));
    if (!p || p.v !== 8 || !Array.isArray(p.orders) || p.orders.length !== Q.SCALE_QS.length || typeof p.pos !== "number") return null;
    return p.pos > 0 ? p : null;
  } catch (e) { return null; }
}
function writeProgress(p) { try { localStorage.setItem(PROGRESS_KEY, JSON.stringify({ v:8, ...p })); } catch (e) {} }
function clearProgress() { try { localStorage.removeItem(PROGRESS_KEY); } catch (e) {} }

function shuffled(n) {
  const r = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

const wrap = { maxWidth:640, margin:"0 auto", padding:"0 20px" };
const cardS = { background:CLR.card, borderRadius:14, padding:"20px", boxShadow:"0 1px 8px rgba(0,0,0,0.05)" };
const primaryBtn = (on = true) => ({ padding:"12px 30px", borderRadius:12, border:"none", fontSize:15, fontWeight:600,
  cursor:on ? "pointer" : "default", color:on ? "#fff" : "#A5A5B5",
  background:on ? `linear-gradient(135deg,${CLR.accent},${CLR.accentEnd})` : CLR.progressBg });
const ghostBtn = { padding:"10px 18px", borderRadius:10, border:`1px solid ${CLR.border}`, background:CLR.card, color:CLR.sub, fontSize:14, cursor:"pointer" };

function TopBar({ done, label }) {
  const pct = (done / TOTAL_Q) * 100;
  return (
    <div style={{ position:"sticky", top:0, zIndex:10, background:"#ffffffee", backdropFilter:"blur(12px)", borderBottom:`1px solid ${CLR.border}`, padding:"10px 20px 12px" }}>
      <div style={wrap}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:12, marginBottom:8 }}>
          <span style={{ fontSize:14, fontWeight:700, color:CLR.text }}>投資者性格探索</span>
          <a href={LINK.types} style={{ fontSize:12, color:CLR.sub, textDecoration:"none", border:`1px solid ${CLR.border}`, borderRadius:20, padding:"4px 12px", background:CLR.card, whiteSpace:"nowrap" }}>
            看 8 種類型
          </a>
        </div>
        <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, color:CLR.sub, marginBottom:6 }}>
          <span>{label}</span><span>{Math.round(pct)}%</span>
        </div>
        <div style={{ height:4, borderRadius:2, background:CLR.progressBg }}>
          <div style={{ height:"100%", borderRadius:2, background:`linear-gradient(90deg,${CLR.accent},${CLR.accentEnd})`, width:`${pct}%`, transition:"width 0.3s" }} />
        </div>
      </div>
    </div>
  );
}

function OptionButton({ text, selected, state, disabled, onClick }) {
  const tone = state === "correct" || state === "answer" ? { b:CLR.good, bg:CLR.goodBg, c:CLR.good }
    : state === "wrong" ? { b:CLR.bad, bg:CLR.badBg, c:CLR.bad }
    : selected ? { b:CLR.accent, bg:"#F3EEFF", c:CLR.accent } : { b:CLR.border, bg:CLR.card, c:CLR.text };
  const tag = state === "correct" ? "答對" : state === "answer" ? "正確答案" : state === "wrong" ? "你的答案" : null;
  return (
    <button onClick={onClick} disabled={disabled} style={{ ...cardS, padding:"14px 16px", textAlign:"left", fontSize:15, lineHeight:1.7,
      color:tone.c, background:tone.bg, border:`${selected || state ? 2 : 1}px solid ${tone.b}`, cursor:disabled ? "default" : "pointer",
      transition:"all 0.15s", display:"flex", alignItems:"center", gap:10 }}>
      <span style={{ flex:1 }}>{text}</span>
      {tag && <span style={{ fontSize:12, fontWeight:600, whiteSpace:"nowrap" }}>{tag}</span>}
    </button>
  );
}

// 線條圖示：路徑資料在 icons.js
function Icon({ name, size = 20, color = "currentColor", stroke = 2 }) {
  const ic = window.QUIZ_ICONS[name];
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style={{ flexShrink:0 }}>
      {(ic.circles || []).map(([cx, cy, r], i) => <circle key={"c" + i} cx={cx} cy={cy} r={r} />)}
      {ic.paths.map((d, i) => <path key={i} d={d} />)}
    </svg>
  );
}

// 類型符文徽章（圖形資料在 icons.js）
const BITS_OF = Object.fromEntries(Object.entries(Q.TYPE_KEY).map(([k, v]) => [v, k]));
function Sigil({ name, size = 64, spin = false }) {
  const c = TYPE_CLR[name], g = window.QUIZ_SIGIL(BITS_OF[name], name), id = "sg" + BITS_OF[name];
  const round = g.frame === "circle";
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" aria-label={`${name}的符文`} role="img" style={{ flexShrink:0, display:"block", overflow:"visible" }}>
      <defs>
        <radialGradient id={id} cx="50%" cy="40%" r="60%">
          <stop offset="0%" stopColor="#fff" />
          <stop offset="100%" stopColor={c.bg} />
        </radialGradient>
      </defs>
      {round
        ? <circle cx="50" cy="50" r="48" fill={`url(#${id})`} stroke={c.m} strokeOpacity="0.35" strokeWidth="1.5" />
        : <path d={g.framePath} fill={`url(#${id})`} stroke={c.m} strokeOpacity="0.4" strokeWidth="1.8" strokeLinejoin="round" />}
      {round && <path d={g.ticks} stroke={c.m} strokeOpacity="0.55" strokeWidth="1.6" strokeLinecap="round" />}
      <g className={spin && round ? "sigil-spin" : undefined} style={{ transformOrigin:"50px 50px" }}>
        {round
          ? <circle cx="50" cy="50" r="36" fill="none" stroke={c.m} strokeOpacity="0.3" strokeWidth="1" strokeDasharray="2 5" />
          : <path d={g.framePath} transform="translate(50 50) scale(0.8) translate(-50 -50)" fill="none" stroke={c.m} strokeOpacity="0.3" strokeWidth="1.2" strokeDasharray="2 5" />}
      </g>
      <g fill="none" stroke={c.m} strokeOpacity="0.7" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
        {g.marks.map((d, i) => <path key={"m" + i} d={d} />)}
      </g>
      {g.markDots.map(([cx, cy, r], i) => <circle key={"md" + i} cx={cx} cy={cy} r={r} fill={c.m} fillOpacity="0.7" />)}
      <g fill="none" stroke={c.m} strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round">
        {g.rune.filter(e => e.t === "path").map((e, i) => <path key={i} d={e.d} />)}
      </g>
      {g.rune.filter(e => e.t === "dot").map((e, i) => <circle key={"d" + i} cx={e.cx} cy={e.cy} r={e.r} fill={c.m} />)}
    </svg>
  );
}

// 標題上方的行情走勢線：載入時畫出來
const TREND = [[0,62],[24,56],[44,60],[66,44],[88,50],[110,34],[132,40],[154,26],[176,34],[198,20],[220,28],[242,14],[264,22],[286,10],[320,16]];
function TrendArt() {
  const line = TREND.map(([x, y]) => `${x},${y}`).join(" ");
  return (
    <svg viewBox="0 0 320 76" width="100%" height="76" preserveAspectRatio="none" aria-hidden="true" style={{ display:"block", maxWidth:420, margin:"0 auto" }}>
      <defs>
        <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={CLR.accent} stopOpacity="0.22" />
          <stop offset="100%" stopColor={CLR.accent} stopOpacity="0" />
        </linearGradient>
      </defs>
      <polygon className="trend-area" points={`0,76 ${line} 320,76`} fill="url(#trendFill)" />
      <polyline className="trend-line" points={line} fill="none" stroke={CLR.accent} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      <circle className="trend-area" cx="286" cy="10" r="4.5" fill={CLR.accent} stroke="#fff" strokeWidth="2" />
    </svg>
  );
}

// 封面（簡版）：字少，但用光譜示意、數字和 8 種類型卡片撐起畫面
const COVER_BARS = [
  { d:"u", from:"22%", to:"78%", delay:"0s" },
  { d:"r", from:"70%", to:"30%", delay:"-1.4s" },
  { d:"m", from:"35%", to:"85%", delay:"-2.8s" },
];

function CoverScreen({ onStart, resume, onResume }) {
  return (
    <div style={{ minHeight:"100vh", background:`linear-gradient(180deg, #F3EEFF 0%, ${CLR.bg} 420px)` }}>
      <div style={{ ...wrap, paddingTop:44, paddingBottom:48, display:"flex", flexDirection:"column", gap:22, animation:"pop 0.35s ease" }}>
        <div style={{ textAlign:"center" }}>
          <TrendArt />
          <p style={{ fontSize:13, fontWeight:700, color:CLR.accent, letterSpacing:2, margin:"14px 0 10px" }}>投資者性格探索</p>
          <h1 style={{ fontSize:32, fontWeight:800, color:CLR.text, lineHeight:1.35 }}>你是哪一種投資人？</h1>
          <p style={{ fontSize:15, color:CLR.sub, marginTop:10 }}>面對漲跌、做決定、看待錢，測出你的位置</p>
        </div>

        <div aria-hidden="true" style={{ ...cardS, padding:"18px 22px", display:"flex", flexDirection:"column", gap:16 }}>
          {COVER_BARS.map(b => {
            const dim = Q.DIMS[b.d];
            return (
              <div key={b.d}>
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, color:CLR.sub, marginBottom:6, gap:8 }}>
                  <span>{dim.low}</span>
                  <span style={{ fontWeight:700, color:CLR.text, display:"inline-flex", alignItems:"center", gap:5 }}><Icon name={b.d} size={15} color={CLR.accent} />{dim.name}</span>
                  <span>{dim.high}</span>
                </div>
                <div style={{ position:"relative", height:8, borderRadius:4, background:`linear-gradient(90deg, ${CLR.progressBg}, ${CLR.accentEnd})` }}>
                  <div className="cover-dot" style={{ "--from":b.from, "--to":b.to, animationDelay:b.delay, position:"absolute", left:b.from, top:-5, transform:"translateX(-50%)",
                    width:18, height:18, borderRadius:9, background:CLR.accent, border:"3px solid #fff", boxShadow:"0 1px 4px rgba(0,0,0,0.25)" }} />
                </div>
              </div>
            );
          })}
        </div>

        {resume && (
          <div style={{ ...cardS, border:`2px solid ${CLR.accent}`, textAlign:"center", padding:"16px 20px" }}>
            <p style={{ fontSize:15, fontWeight:700, color:CLR.text }}>你上次做到第 {resume.done} 題</p>

function QuestionScreen({ step, pos, answers, orders, onAnswer, onNext, onBack, doneCount }) {
  const { k, i } = step;
  const [pending, setPending] = useState(null);
  useEffect(() => { setPending(null); }, [pos]);
  let text, opts, selected, label, hint, note;
  if (k === "scale") { const q = Q.SCALE_QS[i]; text = q.text; note = q.note; opts = orders[i].map(o => ({ o, t:q.opts[o].t })); selected = answers.scale[i]; label = `性格探索 ${i + 1} / ${Q.SCALE_QS.length}`; hint = "沒有對錯・還沒投資過的話，就想像你已經買了"; }
  if (k === "know")  { const q = Q.KNOW_QS[i];  text = q.text; opts = q.opts.map((t, o) => ({ o, t })); selected = answers.know[i]; label = `金融小挑戰 ${i + 1} / ${Q.KNOW_QS.length}`; hint = "選好後按「確定答案」看解說，不確定就選「不知道」"; }
  const nowTotal = NOW_TOTAL;
  if (k === "safe")  { const q = Q.SAFE_QS[i];  text = q.text; opts = q.opts.map((t, o) => ({ o, t })); selected = answers.safe[i]; label = `你的現況 ${i + 1} / ${nowTotal}`; }
  if (k === "pos")   { const q = Q.POS_QS[i];   text = q.text; opts = q.opts.map((t, o) => ({ o, t })); selected = answers.pos[i]; label = `你的現況 ${Q.SAFE_QS.length + i + 1} / ${nowTotal}`; }
  if (k === "behav") { const q = Q.BEHAV_QS[i]; text = q.text; opts = q.opts.map((t, o) => ({ o, t })); selected = answers.behav[i]; label = `你的現況 ${Q.SAFE_QS.length + Q.POS_QS.length + i + 1} / ${nowTotal}`; }
  const mq = k === "pos" ? Q.POS_QS[i] : k === "behav" ? Q.BEHAV_QS[i] : null;
  const isMulti = !!(mq && mq.multi);
  if (isMulti) hint = "可複選";
  const canNext = isMulti ? validMulti(mq, selected) : selected !== null;
  const isLast = step === STEPS[STEPS.length - 1];

  const isKnow = k === "know";
  const kq = isKnow ? Q.KNOW_QS[i] : null;
  const revealed = isKnow && selected !== null;
  const dontKnow = isKnow && selected === kq.opts.length - 1;
  const optState = (o) => {
    if (!revealed) return undefined;
    if (o === kq.answer) return o === selected ? "correct" : "answer";
    if (o === selected) return "wrong";
    return undefined;
  };

  return (
    <div style={{ minHeight:"100vh", background:CLR.bg, paddingBottom:40 }}>
      <TopBar done={doneCount} label={label} />
      <div key={pos} style={{ ...wrap, marginTop:24, animation:"pop 0.3s ease" }}>
        {hint && <p style={{ fontSize:12, color:CLR.accent, fontWeight:600, marginBottom:note ? 2 : 8 }}>{hint}</p>}
        {note && <p style={{ fontSize:12, color:CLR.sub, marginBottom:8 }}>{note}</p>}
        <h2 style={{ fontSize:19, fontWeight:700, color:CLR.text, lineHeight:1.7, marginBottom:20, whiteSpace:"pre-line" }}>{text}</h2>
        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
          {opts.map(({ o, t }) => (
            <OptionButton key={o} text={t} selected={isKnow ? (!revealed && pending === o) : (isMulti ? (selected || []).includes(o) : selected === o)}
              state={optState(o)} disabled={revealed} onClick={() => (isKnow ? setPending(o) : onAnswer(o))} />
          ))}
        </div>
        {revealed && (
          <div style={{ ...cardS, marginTop:14, padding:"14px 16px", boxShadow:"none", animation:"pop 0.3s ease",
            background:selected === kq.answer ? CLR.goodBg : CLR.warnBg, border:`1px solid ${selected === kq.answer ? CLR.goodLine : CLR.warnLine}` }}>
            <p style={{ fontSize:14, fontWeight:700, color:selected === kq.answer ? CLR.good : CLR.warn, marginBottom:4 }}>
              {selected === kq.answer ? "答對了" : dontKnow ? "沒關係，現在知道了" : "差一點"}
            </p>
            <p style={{ fontSize:14, color:CLR.text, lineHeight:1.8 }}>{kq.explain}</p>
          </div>
        )}
        <div style={{ display:"flex", justifyContent:"space-between", marginTop:24 }}>
          <button onClick={onBack} style={ghostBtn}>{pos === 0 ? "回封面" : "上一題"}</button>
          {isKnow && !revealed
            ? <button onClick={() => pending !== null && onAnswer(pending)} disabled={pending === null} style={primaryBtn(pending !== null)}>確定答案</button>
            : <button onClick={onNext} disabled={!canNext} style={primaryBtn(canNext)}>{isLast ? "看結果" : "下一題"}</button>}
        </div>
      </div>
    </div>
  );
}

function App() {
  const fresh = () => ({ scale:Array(Q.SCALE_QS.length).fill(null), know:Array(Q.KNOW_QS.length).fill(null), safe:Array(Q.SAFE_QS.length).fill(null), pos:Array(Q.POS_QS.length).fill(null), behav:Array(Q.BEHAV_QS.length).fill(null) });
  const [saved, setSaved] = useState(readProgress);
  const [pos, setPos] = useState(0);
  const [answers, setAnswers] = useState(fresh);
  const [orders, setOrders] = useState(() => saved ? saved.orders : Q.SCALE_QS.map(q => shuffled(q.opts.length)));
  const [reveal, setReveal] = useState(null);
  const [started, setStarted] = useState(false);
  const advancing = useRef(false);
  const timer = useRef(null);

  // 每答一題就存一次；看結果時清掉
  useEffect(() => { if (started && !reveal) writeProgress({ pos, answers, orders }); }, [started, pos, answers, orders, reveal]);
  const startFresh = () => {
    clearProgress(); setSaved(null);
    setAnswers(fresh()); setPos(0); setOrders(Q.SCALE_QS.map(q => shuffled(q.opts.length)));
    setStarted(true); window.scrollTo({ top:0 });
  };
  const resumeSaved = () => {
    setAnswers(saved.answers); setOrders(saved.orders); setPos(Math.min(saved.pos, STEPS.length - 1));
    setStarted(true); window.scrollTo({ top:0 });
  };

  const step = STEPS[pos];
  const doneCount = STEPS.slice(0, pos).filter(s => s.k !== "chapter").length;

  const finish = (a) => {
    const code = encode(a);
    if (!code) return;
    window.scrollTo({ top:0 });
    clearProgress();
    setReveal({ result:Q.calcResult(a), href:LINK.result(code) });
  };
  // 前進／後退時跳過依作答不需要回答的題目（例如沒投資過就不問年資）
  const next = (a = answers) => {
    window.scrollTo({ top:0 });
    let p = pos + 1;
    while (p < STEPS.length && skipStep(STEPS[p], a)) p++;
    if (p < STEPS.length) setPos(p); else finish(a);
  };
  const back = () => {
    if (timer.current) { clearTimeout(timer.current); timer.current = null; advancing.current = false; }
    if (pos === 0) { setStarted(false); window.scrollTo({ top:0 }); return; }
    let p = pos - 1;
    while (p > 0 && skipStep(STEPS[p], answers)) p--;
    if (p >= 0) { setPos(p); window.scrollTo({ top:0 }); }
  };

  const answer = (o) => {
    const a = { ...answers, scale:[...answers.scale], know:[...answers.know], safe:[...answers.safe], pos:[...answers.pos], behav:[...answers.behav] };
    if (step.k === "scale") a.scale[step.i] = o;
    if (step.k === "know") { if (a.know[step.i] !== null) return; a.know[step.i] = o; }
    if (step.k === "safe") a.safe[step.i] = o;
    const mq = step.k === "pos" ? Q.POS_QS[step.i] : step.k === "behav" ? Q.BEHAV_QS[step.i] : null;
    if (step.k === "behav") a.behav[step.i] = mq.multi ? toggleMulti(mq, a.behav[step.i], o) : o;
    if (step.k === "pos") {
      a.pos[step.i] = mq.multi ? toggleMulti(mq, a.pos[step.i], o) : o;
      Q.POS_QS.forEach((q, j) => { if (isSkipped(q, a.pos)) a.pos[j] = null; });
      Q.BEHAV_QS.forEach((q, j) => { if (isSkipped(q, a.pos)) a.behav[j] = null; });
    }
    setAnswers(a);
    // 小挑戰要看解說，不自動前進；其他題選完自動前進（advancing 防止連點跳題）
    if (step.k !== "know" && !(mq && mq.multi) && !advancing.current) {
      advancing.current = true;
      timer.current = setTimeout(() => { timer.current = null; advancing.current = false; next(a); }, 260);
    }
  };

  if (reveal) return <div style={{ fontFamily:FONT }}><Reveal result={reveal.result} href={reveal.href} /></div>;
  if (!started) {
    const resume = saved && { done:STEPS.slice(0, saved.pos).filter(s => s.k !== "chapter").length + 1 };
    return <div style={{ fontFamily:FONT }}><CoverScreen onStart={startFresh} resume={resume} onResume={resumeSaved} /></div>;
  }
  return (
    <div style={{ fontFamily:FONT, background:CLR.bg, minHeight:"100vh" }}>
      {step.k === "chapter"
        ? <ChapterScreen chapter={step.c} onNext={() => next()} onBack={back} doneCount={doneCount} />
        : <QuestionScreen step={step} pos={pos} answers={answers} orders={orders} onAnswer={answer} onNext={() => next()} onBack={back} doneCount={doneCount} />}
    </div>
  );
}

  return App;
})();

function typeWarm(typeName, c) {
  const w = TYPE_WARM[typeName];

  if (typeName === "開拓者" && !c.trader && !c.panic) {
    if (c.passive) return w.passive;
    if (c.picker) return w.picker;
  }
  if (w.novice && c.novice) return w.novice;
  if (w.concentrated && c.concentrate2 && c.holdsM2) return w.concentrated;
  if (w.holds && c.holdsWinners) return w.holds;
  if (w.neutral && c.holdsNeutral) return w.neutral;
  if (w.shaky && !c.passive && c.shakyFollower) return w.shaky;
  if (w.notPassive && !c.passive) return w.notPassive;
  if (w.panic && c.panic) return w.panic;
  if (w.follow && c.follow) return w.follow;
  if (w.unsafe && c.unsafe && !c.invested) return w.unsafe;
  if (w.invested && c.invested) return w.invested;
  return w.base;
}

function mottoFor(typeName, c) {

  if (typeName === "策略家" && c.holdsWinners) return "不能動的錢，每年確認一次是不是真的不能動。";
  if (typeName === "策略家" && c.holdsNeutral) return "把心裡的那條線，寫成規則。";
  if (typeName === "開拓者" && !c.trader && !c.panic) return c.passive ? "核心照扣，個股看錯就認。" : "看錯的條件，買之前就寫好。";
  if (c.hs && !c.passive) return "先存再花，存下的一部分才拿去投資。";
  if (typeName === "守望者" && c.exited && !c.invested) return "先找到上次錯在哪，再決定回不回去。";
  if (typeName === "守望者" && c.passive && !c.retire && !c.panic) return "已經在扣的，跌了也照扣。";
  if (typeName === "守望者") {
    if (c.retire) return "要用的錢，先放在安全的地方。";
    if (c.unsafe && !c.invested) return "先存好底，再小額開始。";
    if (c.delegated && !c.panic) return "看清楚手上有什麼，再決定。";
  }
  if (c.panic && typeName !== "開拓者") return "什麼時候賣，冷靜時就先寫好。";
  return MOTTO[typeName];
}

const CFG = window.QUIZ_CONFIG || {};

// 送出過聯絡資料的作答代碼清單（JSON 陣列）；舊版只存一個代碼字串，讀的時候一併相容
function sentCodes() {
  try {
    const v = localStorage.getItem(SENT_KEY);
    if (!v) return [];
    if (v[0] !== "[") return [v];
    const list = JSON.parse(v);
    return Array.isArray(list) ? list : [];
  } catch (e) { return []; }
}

function sentFor(code) { return !!code && sentCodes().includes(code); }

}

    life:opt(Q.SAFE_QS[0], Q.SAFE_QS[0].codes, result.life),
    practice:result.practices.map(c => opt(p1, p1.codes, c)).join("、"),
    years:result.years ? opt(p2, p2.codes, result.years) : "", goal:opt(p3, p3.codes, result.goal),
    know:`${result.knowCorrect} / ${Q.KNOW_QS.length}`, consent:"同意",
    url:resultUrl(code), code, version:result.version,
  };
}
function ContactForm({ result, code, onSent }) {
  const sentBefore = sentFor(code);
  const [form, setForm] = useState({ nickname:"", email:"", phone:"", website:"" });
  const [consent, setConsent] = useState(false);
  const [state, setState] = useState(sentBefore ? "sent" : "idle");
  if (!SUBMIT_URLS.length) return null;
  const emailBad = form.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim());
  const phoneBad = form.phone.trim() && !/^[0-9+\-()\s]{8,20}$/.test(form.phone.trim());
  // 稱呼必填；Email 和電話至少填一個（有填的那欄格式要對）
  const hasName = !!form.nickname.trim();
  const hasContact = !!(form.email.trim() || form.phone.trim());
  const missing = [!hasName && "稱呼", !hasContact && "Email 或電話（擇一）", !consent && "勾選同意"].filter(Boolean);
  const canSend = !missing.length && !emailBad && !phoneBad && state !== "sending";
  const set = (k) => (e) => setForm({ ...form, [k]:e.target.value });
  const submit = async (e) => {
    e.preventDefault();
    if (!canSend) return;
    setState("sending");
    try {
      // 每個收件網址各送一次，只要有一個送出成功就算完成
      const body = contactPayload(result, code, form);
      const ok = await Promise.all(SUBMIT_URLS.map(u => fetch(u, { method:"POST", mode:"no-cors", body:new URLSearchParams(body) }).then(() => true, () => false)));
      if (!ok.some(Boolean)) throw new Error("all failed");
      markSent(code);
      setState("sent");
      if (onSent) onSent();
    } catch (err) { setState("error"); }
  };
  const input = { width:"100%", padding:"11px 12px", borderRadius:10, border:`1px solid ${CLR.border}`, fontSize:15, fontFamily:"inherit", background:"#fff", color:CLR.text };
  const fl = { display:"block", fontSize:13, fontWeight:600, color:CLR.sub, marginBottom:4 };
  if (state === "sent") return (
    <div style={{ ...cardS, width:"100%", textAlign:"center", boxShadow:"none", border:`1px solid ${CLR.goodLine}`, background:CLR.goodBg }}>
      <p style={{ fontSize:15, fontWeight:700, color:CLR.good }}>{CFG.THANKS_TEXT || "已收到，謝謝你！"}</p>
    </div>
  );
  return (
    <form onSubmit={submit} style={{ ...cardS, width:"100%", display:"flex", flexDirection:"column", gap:12 }}>
      <div>
        <p style={{ fontSize:16, fontWeight:800, color:CLR.text }}>{CFG.FORM_TITLE}</p>
        <p style={{ fontSize:13, color:CLR.sub, lineHeight:1.7, marginTop:4 }}>{CFG.FORM_DESC}</p>
      </div>
      <label><span style={fl}>稱呼<span style={{ color:CLR.bad }}> *</span></span><input style={input} value={form.nickname} onChange={set("nickname")} maxLength={40} autoComplete="nickname" placeholder="例如：小明、王先生" required /></label>
      <div style={{ display:"flex", flexDirection:"column", gap:10, padding:"12px", borderRadius:10, background:CLR.bg }}>
        <p style={{ fontSize:13, fontWeight:600, color:CLR.sub }}>聯絡方式<span style={{ color:CLR.bad }}> *</span><span style={{ fontWeight:400 }}>　Email 和電話至少填一個</span></p>
        <label><span style={fl}>Email</span><input style={input} type="email" value={form.email} onChange={set("email")} maxLength={120} autoComplete="email" inputMode="email" />
          {emailBad && <span style={{ fontSize:12, color:CLR.bad }}>Email 格式好像不太對</span>}</label>
        <label><span style={fl}>電話</span><input style={input} type="tel" value={form.phone} onChange={set("phone")} maxLength={20} autoComplete="tel" inputMode="tel" />
          {phoneBad && <span style={{ fontSize:12, color:CLR.bad }}>電話請填數字，例如 0912345678</span>}</label>
      </div>
      <input className="sr-only" tabIndex={-1} aria-hidden="true" autoComplete="off" value={form.website} onChange={set("website")} />
      <label style={{ display:"flex", gap:8, alignItems:"flex-start", fontSize:13, color:CLR.sub, lineHeight:1.7, cursor:"pointer" }}>
        <input type="checkbox" checked={consent} onChange={(e) => setConsent(e.target.checked)} style={{ marginTop:5, width:16, height:16, flexShrink:0 }} />
        <span>{CFG.CONSENT_TEXT}</span>
      </label>
      {state === "error" && <p style={{ fontSize:13, color:CLR.bad }}>送出失敗，請檢查網路後再試一次。</p>}
      {missing.length > 0 && <p style={{ fontSize:12, color:CLR.sub, textAlign:"center" }}>還差：{missing.join("、")}</p>}
      <button type="submit" disabled={!canSend} style={{ padding:"12px", borderRadius:10, border:"none", fontSize:15, fontWeight:700, cursor:canSend ? "pointer" : "default",
        color:canSend ? "#fff" : CLR.faint, background:canSend ? `linear-gradient(135deg, ${CLR.accent}, ${CLR.accentEnd})` : CLR.progressBg }}>
        {state === "sending" ? "送出中…" : (CFG.SUBMIT_LABEL || "送出")}
      </button>
    </form>
  );
}

// ── 分頁切換：上方分頁列＋內容滑入動畫，下方按鈕帶往下一頁 ──
const TABS = [
  { key:"result", label:"測驗結果", icon:"target", next:"看我的學習地圖" },
  { key:"map", label:"學習地圖", icon:"map", next:"讀教練的信" },
  { key:"letter", label:"教練的信", icon:"mail", next:null },
];

// 還沒送出聯絡資料時，教練的信不能進入
const LOCKED_TAB = "letter";

function TabBar({ tab, go, color, locked }) {
  return (
    <div role="tablist" style={{ position:"sticky", top:0, zIndex:10, background:"rgba(248,246,252,0.92)", backdropFilter:"blur(10px)", padding:"8px 0 10px", margin:"0 0 14px" }}>
      <div style={{ position:"relative", display:"grid", gridTemplateColumns:`repeat(${TABS.length}, 1fr)`, background:CLR.card, borderRadius:14, padding:4, boxShadow:"0 1px 8px rgba(0,0,0,0.06)" }}>
        <span aria-hidden="true" style={{ position:"absolute", top:4, bottom:4, left:4, width:`calc((100% - 8px) / ${TABS.length})`, borderRadius:10, background:color,
          transform:`translateX(${tab * 100}%)`, transition:"transform .35s cubic-bezier(.2,.8,.2,1)" }} />
        {TABS.map((t, i) => {
          const off = locked && t.key === LOCKED_TAB;
          return (
            <button key={t.key} id={`tab-${t.key}`} role="tab" aria-selected={tab === i} disabled={off} aria-disabled={off || undefined}
              title={off ? "送出聯絡方式後開啟" : undefined} onClick={() => go(i)}
              style={{ position:"relative", zIndex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:6, padding:"10px 4px", border:"none", background:"none",
                fontSize:14, fontWeight:tab === i ? 800 : 500, color:tab === i ? "#fff" : CLR.sub, cursor:off ? "not-allowed" : "pointer", opacity:off ? 0.45 : 1, transition:"color .25s, opacity .25s" }}>
              <Icon name={off ? "lock" : t.icon} size={15} color={tab === i ? "#fff" : CLR.faint} />{t.label}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function ResultView({ result, sample, code }) {
  const [tab, setTab] = useState(0);
  const [dir, setDir] = useState(1);
  // 送出聯絡資料前：學習地圖的課程模糊、教練的信不能進入。範例頁、沒設收件網址時不啟用
  const [sent, setSent] = useState(() => sentFor(code));
  const locked = !sample && SUBMIT_URLS.length > 0 && !sent;
  const tc = TYPE_CLR[result.typeName];
  const go = (i) => {
    if (i === tab) return;
    if (locked && TABS[i].key === LOCKED_TAB) return;
    setDir(i > tab ? 1 : -1);
    setTab(i);
    window.scrollTo({ top:0, behavior:"smooth" });
  };
  const toForm = () => { const el = document.getElementById("contact-form"); if (el) el.scrollIntoView({ behavior:"smooth", block:"start" }); };
  // 範例頁只給看測驗結果；學習地圖和教練的信要做完測驗、依自己的狀況產生
  const next = sample ? null : TABS[tab].next;
  // 下一頁還鎖著時，按鈕改成帶去填表單，不能繞過
  const nextLocked = !!next && locked && TABS[tab + 1].key === LOCKED_TAB;
  return (
    <div>
      {sample && <p style={{ fontSize:13, color:CLR.sub, textAlign:"center", lineHeight:1.7, marginBottom:4 }}>「{result.typeName}」範例・假設{sampleProfile(result.typeName).desc}<br />不是你的結果</p>}
      {!sample && <TabBar tab={tab} go={go} color={CLR.accent} locked={locked} />}
      <div key={tab} role="tabpanel" aria-labelledby={`tab-${TABS[tab].key}`} className={dir > 0 ? "slide-in-right" : "slide-in-left"}>
        {tab === 0 && <ResultTab result={result} sample={sample} />}
        {!sample && tab === 1 && <MapSection result={result} locked={locked} />}
        {!sample && tab === 2 && <LetterSection result={result} sample={sample} go={go} />}
      </div>

      <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:12, marginTop:22 }}>
        {sample && <p style={{ fontSize:14, color:CLR.sub, textAlign:"center", lineHeight:1.7 }}>做完測驗，就能看到依你自己的狀況整理的學習地圖和教練的信。</p>}
        {next
          ? <button id="next-tab" onClick={() => (nextLocked ? toForm() : go(tab + 1))} style={{ display:"inline-flex", alignItems:"center", gap:8, padding:"14px 32px", borderRadius:12, border:"none", cursor:"pointer",
              fontSize:16, fontWeight:700, color:"#fff", background:`linear-gradient(135deg, ${CLR.accent}, ${CLR.accentEnd})`, boxShadow:"0 8px 20px rgba(109,40,217,0.28)" }}>
              {nextLocked ? "填寫資料解鎖教練的信" : next}<Icon name={nextLocked ? "lock" : "chevron"} size={18} color="#fff" />
            </button>
          : <a href={LINK.quiz} style={{ ...btn, padding:"14px 32px", fontSize:16, fontWeight:700, color:"#fff", border:"none", background:`linear-gradient(135deg, ${CLR.accent}, ${CLR.accentEnd})` }}>{sample ? "做測驗看自己的結果" : "重新測驗"}</a>}
        <div style={{ display:"flex", gap:16, fontSize:13 }}>
          {tab > 0 && <button onClick={() => go(tab - 1)} style={{ background:"none", border:"none", padding:0, color:CLR.sub, cursor:"pointer", fontSize:13 }}>← 上一頁</button>}
          {!sample && tab < TABS.length - 1 && <a href={LINK.quiz} style={{ color:CLR.sub }}>重新測驗</a>}
          <a href={LINK.types} style={{ color:CLR.sub }}>看其他類型</a>
        </div>
        {!sample && TABS[tab].key === "map" && (
          <div id="contact-form" style={{ width:"100%", scrollMarginTop:90 }}>
            <ContactForm result={result} code={code} onSent={() => setSent(true)} />
          </div>
        )}
        <p style={{ fontSize:12, color:CLR.sub, textAlign:"center", lineHeight:1.7 }}>{!sample && <>包含個人分析數據，建議儲存或填寫上方 Email 備份。<br /></>}依作答整理，僅供自我了解與學習規劃，不是針對個人的投資建議。</p>
      </div>
    </div>
  );
}

function EmptyState() {
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
      <div style={{ textAlign:"center", padding:"20px 0 8px" }}>
        <h1 style={{ fontSize:24, fontWeight:800, color:CLR.text, marginBottom:16 }}>還沒有結果</h1>
        <div style={{ display:"flex", gap:10, justifyContent:"center", flexWrap:"wrap" }}>
          <a href={LINK.quiz} style={{ ...btn, background:CLR.accent, color:"#fff", border:"none", fontWeight:600 }}>開始測驗</a>
        </div>
      </div>
      <p style={{ ...label, textAlign:"center", marginBottom:0 }}>8 種類型</p>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(220px, 1fr))", gap:10 }}>
        {Object.entries(Q.TYPES).map(([name, t]) => (
          <a key={name} className="type-card" href={LINK.result(encode(sampleAnswers(name)), true)} style={{ ...cardS, padding:"12px 16px", textDecoration:"none", background:TYPE_CLR[name].bg, boxShadow:"none" }}>
            <p style={{ fontSize:16, fontWeight:700, color:TYPE_CLR[name].m, display:"flex", alignItems:"center", gap:10 }}><Sigil name={name} size={40} />{name}</p>
            <p style={{ fontSize:12, fontWeight:600, color:TYPE_CLR[name].m, marginTop:4, letterSpacing:.5 }}>{Q.typeTags(name).join("・")}</p>
            <p style={{ fontSize:13, color:CLR.sub, marginTop:2, lineHeight:1.6 }}>{t.tag}</p>
          </a>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [hash, setHash] = useState(readHash);
  useEffect(() => {
    const on = () => { setHash(readHash()); window.scrollTo({ top:0 }); };
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  const answers = decode(hash.code);
  return (
    <div style={{ fontFamily:FONT, background:CLR.bg, minHeight:"100vh", paddingBottom:40 }}>
      <div style={{ ...wrap, paddingTop:14, paddingBottom:6 }}>
        <a href={LINK.quiz} style={{ fontSize:14, fontWeight:700, color:CLR.text, textDecoration:"none" }}>投資者性格探索</a>
      </div>
      <div style={wrap}>
        {answers ? <ResultView key={hash.code} result={Q.calcResult(answers)} sample={hash.sample} code={hash.code} /> : <EmptyState />}
      </div>
    </div>
  );
}

  return App;
})();

// ── 依網址標記切換畫面 ──
const TITLES = { quiz:"投資者性格探索", result:"投資者性格探索｜結果" };
function Root() {
  const [view, setView] = React.useState(() => viewOf(window.location.hash));
  React.useEffect(() => {
    const on = () => setView(viewOf(window.location.hash));
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  React.useEffect(() => { document.title = TITLES[view]; window.scrollTo({ top:0 }); }, [view]);
  return view === "result" ? <ResultApp /> : <QuizApp />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
